<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockWallet Hardware Wallet Bridge</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }

        #status {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
            font-family: monospace;
            background-color: #f5f5f5;
        }

        .hidden {
            display: none;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .log {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 8px;
            font-family: monospace;
            font-size: 12px;
            background-color: #f5f5f5;
        }
    </style>
</head>

<body>
    <h1>BlockWallet Hardware Wallet Offscreen Bridge</h1>
    <div id="status">Initializing hardware wallet bridge...</div>
    <div id="log-container">
        <h3>Connection Log</h3>
        <div class="log" id="log"></div>
    </div>

    <!-- Load Buffer and hardware wallet dependencies -->
    <script src="buffer.js"></script>
    <script src="hw-app-eth.js"></script>
    <script src="ledger-bridge-keyring.js"></script>

    <!-- Load external scripts instead of inline script -->
    <script src="offscreen-logger.js"></script>
    <script src="offscreen.js"></script>
</body>

</html>
